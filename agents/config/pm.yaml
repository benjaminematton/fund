seat: pm
# `claude-sonnet-5` is the complete id: current-generation ids carry no date
# suffix, so there is no dated snapshot to pin to. The haiku seats'
# `claude-haiku-4-5-20251001` is dated only because that model was published
# under a dated id. Never append a date here — it would 404 (#125).
model: claude-sonnet-5
fallback_model: claude-sonnet-5
max_budget_usd: 0.75
# MEASURED 2026-08-17: 5 turns, $0.1161 (the dearest seat — Sonnet).
max_turns: 10
alpaca_toolsets: "account,stock-data"   # READ-ONLY (invariant 2)
tools: ["mcp__fund__*", "mcp__alpaca__*"]
disallowed_tools: ["mcp__alpaca__place_*"]   # belt over the toolset braces
setting_sources: []
