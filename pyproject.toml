[project]
name = "fund-backtest-starter"
version = "0.1.0"
description = "run_backtest tool + deterministic strategy gate (specs/strategy.md)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.23,<3.0",
    "pandas>=2.0,<3.0",
    "pydantic>=2.7,<3",
    "claude-agent-sdk~=0.2.116",
    "slack-bolt>=1.18,<2",
    "pyyaml>=6,<7",
    "alpaca-py>=0.21,<1",
]

[project.optional-dependencies]
vbt = ["vectorbt>=1.0.0,<1.1"]   # fast engine; numba>=0.60 comes with it
dev = ["pytest>=8"]

# CI must enforce (same rules as gate/):
#  - stratgate/ and fundbt/ import no LLM/SDK code
#  - no datetime.now() / time.sleep() in business logic (Clock is injected)
#  - tests/test_golden.py numbers change only via deliberate re-record commits

[tool.pytest.ini_options]
addopts = "-m 'not live and not eval' -q"
markers = [
    "live: hits real APIs (Alpaca paper, Slack, Anthropic) — excluded from make test; run manually with: pytest -m live <file> -v",
    "eval: spends real money on real LLM turns (evals/) — excluded from make test; run with: make eval",
]
filterwarnings = ["error::DeprecationWarning:fund.*",
  "ignore::DeprecationWarning:websockets.legacy.*"]
