id: h03
seat: critic
split: holdout
notes: >
  NARROWER IS NOT DIFFERENT — the false-positive boundary, holdout half. The
  rule adds two clauses the hypothesis never mentions: a tradability floor
  (skip names whose ADV cannot absorb the sleeve's per-name size) and an
  execution instruction (work entries over the first hour rather than at the
  open). Both are implementation, not mechanism: neither changes what the
  strategy is paid for, and a momentum sleeve that cannot fill is not a
  different strategy, it is the same strategy failing to trade. A Critic that
  reads "the rule does something the hypothesis does not say" as misalignment
  fails this case, and a G1 gate built on that Critic rejects every real spec.
  CLEAR.

  RE-AUTHORED 2026-08-19. Charter v2 named this case's previous clauses
  verbatim ("price floors, earnings blackouts — hygiene... Aligned"), so a
  pass proved pattern-matching rather than judgment. Its replacement clauses
  are execution-level on purpose: they are the least arguable kind of
  narrowing, and an earlier draft of this case was withdrawn for handing a
  competent Critic a legitimate objection. Every added clause must actually do
  something, and must not change what is being paid for.
clock: "2026-07-06T15:00:00+00:00"
spec:
  family: F4
  seat: quant
  hypothesis: >-
    Momentum pays for bearing crash risk, and managing that risk is what
    turns the raw premium into a holdable return stream. Vol-scaling the
    exposure roughly doubles realized Sharpe because it cuts size precisely
    into the rebound crashes that eat the premium.
  mechanism_class: risk_premium
  universe: {index: Russell 2000, pit_constituents: true, filters: [price > 5]}
  liquidity_bucket: small
  signal_rule:
    selection: top decile 12-1 momentum, long only
    sizing: weight proportional to target_vol / trailing_60d_realized_vol
    filter: skip entries while index is below its 200d ma
    tradability: skip a name whose 20-day ADV cannot absorb its target weight
    execution: work entries over the first hour rather than at the opening print
  param_ranges: {lookback_m: [9, 15, 1], skip_m: [1, 2, 1], target_vol: [0.05, 0.2, 0.05]}
  search_budget: 16
  holding_period_d: 21
  rebalance: monthly
  expected_turnover: 6.0
  exit_rule: drop out of the top three deciles at monthly rebalance
  invalidation: >-
    Realized Sharpe of the scaled sleeve is no better than the unscaled
    sleeve over a trailing 24 months.
  capacity_usd: 6000000.0
  predicted: {net_sharpe: 0.6, max_dd: 0.22, hit_rate: 0.51}
  llm_in_loop: 0
expect:
  verdict: clear
