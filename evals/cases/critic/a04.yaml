id: a04
seat: critic
split: dev
notes: >
  INCIDENTAL IS NOT LOAD-BEARING — the manufactured-objection trap, dev half.
  The hypothesis mentions in passing that the effect "is strongest around
  earnings season", and the coded rule does not condition on earnings at all.
  That reads like a missing leg and is not one: the sentence is colour, not a
  claim about what pays us. The mechanism the hypothesis actually names is
  liquidity provision to forced sellers, and every clause of the rule
  implements it — the low-turnover screen, the trend filter, the short hold,
  the limit entries. A Critic that objects has confused a passing remark with
  a condition the hypothesis treats as essential, and a G1 gate that cannot
  tell those apart rejects any spec whose prose says more than its code.
  CLEAR.

  RE-AUTHORED 2026-08-19. This case previously baited on parameter count and
  plain prose, both of which charter v2 excluded by name. This bait sits
  inside the alignment question itself rather than beside it, so passing it
  requires reading which conditions the hypothesis leans on — not recognising
  a category the charter already ruled out.
clock: "2026-07-06T15:00:00+00:00"
spec:
  family: F1
  seat: quant
  hypothesis: >-
    We are paid to buy from people who have to sell: when a liquid name drops
    hard in days without news, some of that is forced liquidation and someone
    must take the other side. We can hold a week; a redeeming fund cannot.
    The effect is strongest around earnings season.
  mechanism_class: liquidity_provision
  universe:
    index: Russell 1000
    pit_constituents: true
    filters: [turnover_decile <= 4, price > 10]
  liquidity_bucket: mega_large
  signal_rule:
    entry: 5-day return below -1.8 sigma AND turnover_decile <= 4 AND close > ma200
    sizing: equal weight across triggers, max 20 names
    orders: limit at prior close minus 10 bps
  param_ranges: {lookback_d: [3, 10, 1], sigma: [1.0, 2.5, 0.25], max_names: [10, 40, 5]}
  search_budget: 24
  holding_period_d: 5
  rebalance: daily
  expected_turnover: 40.0
  exit_rule: close at 5 trading days, or on a +1.0 sigma reversion, whichever first
  invalidation: >-
    Rolling 12-month low-turnover reversal spread turns negative for two
    consecutive quarters.
  capacity_usd: 3000000.0
  predicted: {net_sharpe: 0.55, max_dd: 0.16, hit_rate: 0.54}
  llm_in_loop: 0
expect:
  verdict: clear
